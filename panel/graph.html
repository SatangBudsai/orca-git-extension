  .pipe-row { padding: 12px 8px; }
  .idp-list { grid-template-columns: 1fr; padding: 0 12px 8px; }
}
/* skeleton rows had no width, so the loading state looked blank */
.skeleton-row .bar { flex: 1; }
.skeleton-list .skeleton-row:nth-child(2) .bar { flex: 0 1 70%; }
.skeleton-list .skeleton-row:nth-child(3) .bar { flex: 0 1 50%; }
@media (max-width: 820px) { .history-bar select, .mode-select { min-height: 36px; } }
@media (max-width: 820px) { select.mode-select, .history-bar select.mode-select { height: 36px; } }
/* the skeleton rows start see-through for their fade-in; make sure they end visible */
.skeleton-list .skeleton-row { opacity: 1; animation: skelIn .3s ease-out; }
@keyframes skelIn { from { opacity: 0; } to { opacity: 1; } }
/* segmented switches never wrap their words; on a phone they scroll sideways instead */
.segmented button { white-space: nowrap; flex: none; }
@media (max-width: 820px) { .segmented { max-width: 100%; overflow-x: auto; scrollbar-width: none; } .segmented::-webkit-scrollbar { display: none; } }

/* search: matches highlighted in the rows */
mark.hit { background: color-mix(in srgb, var(--mod) 38%, transparent); color: var(--fg); border-radius: 3px; padding: 0 1px; box-shadow: 0 0 0 1px color-mix(in srgb, var(--mod) 30%, transparent); }
.match-note { flex: none; margin-left: 8px; padding: 0 8px; border-radius: 999px; font-size: 11px; line-height: 17px; color: var(--t2); background: var(--card-hi); }
.graph-search::-webkit-search-cancel-button { cursor: pointer; }
.history-bar .graph-search { flex: 1 1 240px; min-width: 0; }
.update-bar { position: sticky; top: 0; z-index: var(--z-toast, 60); display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: color-mix(in srgb, var(--ren) 18%, var(--raised)); border-bottom: 1px solid color-mix(in srgb, var(--ren) 40%, var(--line)); font-size: 13px; }

/* sheets live beside the scrolling area: they stay whole while the list scrolls */
.sheet-host { position: relative; }
.sheet-host > .sheet { bottom: 0; }
.sheet-grip { position: absolute; left: -3px; top: 0; bottom: 0; width: 7px; cursor: col-resize; z-index: 3; }
.sheet-grip:hover, .sheet-grip:active { background: color-mix(in srgb, var(--ren) 45%, transparent); }
@media (max-width: 820px) { .sheet-grip { display: none; } .sheet-host > .sheet { width: 100% !important; } }

/* ---------- toolbar on the right: where you are on the left, what you can do on the right ---------- */
@media (min-width: 821px) {
  body.wide .repo-line { display: contents; }
  body.wide header .toolbar { order: 3; margin-left: auto; }
  body.wide #branchLine { order: 2; }
}
.tb-sep { flex: none; width: 1px; height: 18px; margin: 0 4px; background: var(--line); }
.tb-count { display: inline-flex; align-items: center; justify-content: center; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 999px; background: var(--ren); color: var(--ref-head-ink, #10131a); font-size: 11px; font-weight: 600; line-height: 1; }
.toolbar .icon-btn.tb-hot { border-color: color-mix(in srgb, var(--ren) 55%, var(--line)); background: color-mix(in srgb, var(--ren) 14%, var(--card)); color: var(--t1); }
.icon-btn.tb-hot:not(.toolbar *) { color: var(--ren); }

/* ---------- graph rows: density, keyboard selection, quick actions ---------- */
.commit-row { height: var(--row-h, 28px); contain-intrinsic-size: auto var(--row-h, 28px); position: relative; }
.commit-row.kbd { box-shadow: inset 2px 0 0 var(--ren); background: var(--hover); }
.row-actions { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); display: none; gap: 2px; padding: 0 4px 0 20px; background: linear-gradient(90deg, transparent, var(--row-bg, var(--bg)) 16px); }
.commit-row:hover .row-actions, .commit-row.kbd .row-actions { display: flex; }
.commit-row:hover, .commit-row.kbd { --row-bg: color-mix(in srgb, var(--fg) 5%, var(--bg)); }
.commit-row.selected { --row-bg: color-mix(in srgb, var(--ren) 14%, var(--bg)); }
.ra-btn { width: 24px; height: 22px; padding: 0; border-radius: 6px; background: var(--card); border: 1px solid var(--line); color: var(--t2); }
.ra-btn:hover { color: var(--t1); border-color: var(--line-hi); background: var(--card-hi); }
@media (hover: none) { .row-actions { display: none !important; } }
.density-btn.on { color: var(--ren); border-color: color-mix(in srgb, var(--ren) 45%, var(--line)); }
.history-bar .density-btn { height: 28px; width: 30px; border: 1px solid var(--line); background: var(--card); border-radius: 8px; }

/* the day of the rows at the top, pinned while the list scrolls */
.date-float-wrap { position: sticky; top: 4px; height: 0; z-index: 4; display: flex; justify-content: center; pointer-events: none; }
.date-float { margin-top: 2px; padding: 3px 12px; border-radius: 999px; background: var(--raised); border: 1px solid var(--line); box-shadow: var(--shadow); color: var(--t1); font-size: 12px; font-weight: 600; opacity: 0; transform: translateY(-4px); transition: opacity .15s, transform .15s; }
.date-float.on { opacity: 1; transform: none; }

/* ---------- split view: docked details beside the graph ---------- */
.sheet-host.docked > #main { margin-right: var(--dock-w, 0px); }
.sheet.dock { box-shadow: none; animation: none; }
.sheet.dock .sheet-body > div:not(.inline-skeleton) { padding-bottom: 12px; }

/* ---------- empty states say what to do next ---------- */
.empty-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 16px; }

/* ---------- command palette ---------- */
.pal-overlay { align-items: flex-start; padding-top: 12vh; }
.palette { width: min(560px, calc(100vw - 32px)); display: flex; flex-direction: column; background: var(--raised); border: 1px solid var(--line-hi); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.pal-input { border: 0 !important; border-bottom: 1px solid var(--line) !important; border-radius: 0 !important; padding: 16px 16px !important; font-size: 14px; background: transparent !important; box-shadow: none !important; }
.pal-list { max-height: min(50vh, 380px); overflow: auto; padding: 8px; }
.pal-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 12px; border: 0; border-radius: 8px; background: transparent; color: var(--t1); text-align: left; font: inherit; cursor: pointer; }
.pal-item svg { color: var(--t2); }
.pal-item.on { background: var(--sel); }
.pal-item.on svg { color: var(--ren); }
.pal-none { padding: 16px; color: var(--t2); text-align: center; }
.pal-foot { padding: 8px 12px; border-top: 1px solid var(--line); color: var(--t3); font-size: 11px; }
.kbd-help { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; align-items: center; margin: 12px 0 4px; }
.kbd-help kbd { justify-self: start; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line-hi); border-bottom-width: 2px; background: var(--card); font: 11.5px var(--mono, ui-monospace, monospace); color: var(--t1); }
/* docked: the message gets the room; the date moves into the row's tooltip and the pane */
.sheet-host.docked .col-date { display: none; }
.sheet-host.docked .col-author { width: 110px; }

/* ---------- labels never run under the message or the next column ---------- */
.commit-text { overflow: hidden; }
.commit-subject { overflow: hidden; }
.commit-subject > .ref { flex: 0 1 auto; min-width: 34px; }
.commit-subject > .ref:first-child { flex-shrink: 0.4; }
.commit-subject .s { flex: 1 1 60px; min-width: 40px; }

/* ---------- sheet head: Back (when stacked) and Close ---------- */
.sheet-head { gap: 8px; padding: 8px 8px 8px 12px; min-height: 44px; }
.sheet-back { display: inline-flex; align-items: center; gap: 4px; flex: none; height: 28px; padding: 0 12px 0 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--t1); font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
.sheet-back:hover { background: var(--card-hi); border-color: var(--line-hi); }
.sheet-back svg { color: var(--t2); }
.sheet-close { width: 30px; height: 30px; flex: none; justify-content: center; border-radius: 8px; color: var(--t2); }
.sheet-close:hover { background: color-mix(in srgb, var(--del) 16%, var(--card)); color: var(--t1); }
.sheet-close svg { width: 16px; height: 16px; }

/* ---------- toolbar buttons show the work: spinning or moving while it runs, a tick when done ---------- */
.toolbar .icon-btn.working { border-color: color-mix(in srgb, var(--ren) 60%, var(--line)); color: var(--t1); }
.toolbar .icon-btn.working svg { animation: tbSpin .8s linear infinite; }
.toolbar .icon-btn.working[data-op="pull"] svg, .toolbar .icon-btn.working[data-op="fetch"] svg { animation: tbDown .7s ease-in-out infinite; }
.toolbar .icon-btn.working[data-op="push"] svg { animation: tbUp .7s ease-in-out infinite; }
.toolbar .icon-btn.working[data-op="stash"] svg, .toolbar .icon-btn.working[data-op="undo"] svg { animation: tbPulse .8s ease-in-out infinite; }
.toolbar .icon-btn.working::after { content: ''; position: absolute; left: 8px; right: 8px; bottom: 2px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--ren), transparent); background-size: 200% 100%; animation: tbBar 1s linear infinite; }
.toolbar .icon-btn { position: relative; }
.toolbar .icon-btn.done { border-color: color-mix(in srgb, var(--add) 65%, var(--line)); background: color-mix(in srgb, var(--add) 14%, var(--card)); transition: background-color .4s, border-color .4s; }
.toolbar .icon-btn.done svg { color: var(--add); animation: tbPop .35s var(--ease); }
@keyframes tbSpin { to { transform: rotate(360deg); } }
@keyframes tbDown { 0%, 100% { transform: translateY(-2px); } 50% { transform: translateY(2px); } }
@keyframes tbUp { 0%, 100% { transform: translateY(2px); } 50% { transform: translateY(-2px); } }
@keyframes tbPulse { 50% { transform: scale(.82); opacity: .6; } }
@keyframes tbBar { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@keyframes tbPop { 0% { transform: scale(.6); } 70% { transform: scale(1.18); } }
@media (prefers-reduced-motion: reduce) { .toolbar .icon-btn.working svg, .toolbar .icon-btn.done svg, .toolbar .icon-btn.working::after { animation: none; } }

/* ---------- pipelines: breadcrumbs, what failed, error stepping, find, wrap ---------- */
.pipe-crumbs { gap: 8px; }
.pipe-crumbs > svg, .pipe-crumbs > span > svg { color: var(--t3); }
.crumb { border: 0; background: none; padding: 3px 8px; border-radius: 6px; color: var(--ren); font: inherit; font-weight: 600; cursor: pointer; }
.crumb:hover { background: var(--hover); text-decoration: underline; }
.pipe-failed { display: flex; align-items: center; gap: 12px; margin: 12px 16px 4px; padding: 12px 12px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--del) 45%, var(--line)); background: color-mix(in srgb, var(--del) 10%, var(--card)); }
.pipe-failed > span:first-child { color: var(--del); }
.pipe-logbar { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--raised); position: sticky; top: 0; z-index: 2; }
.pl-errnav { display: flex; align-items: center; gap: 8px; color: var(--del); }
.pl-errnav.ok { color: var(--add); }
.pl-errnav b { color: var(--t1); margin-right: 2px; }
.pl-errnav .icon-btn { width: 26px; height: 24px; justify-content: center; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
.pl-errnav .check { margin-left: 8px; color: var(--t2); }
.pl-counter { min-width: 44px; text-align: center; }
.pl-find { width: 200px; height: 28px; }
.pl-live { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; background: color-mix(in srgb, var(--ren) 16%, transparent); color: var(--ren); font-size: 11px; font-weight: 600;  }
.pl-live i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: tbPulse 1.2s ease-in-out infinite; }
.pipe-log.wrap .pl { min-width: 0; }
.pipe-log.wrap .pl-t { white-space: pre-wrap; word-break: break-word; }
.pipe-log.only-bad .pl:not(.bad) { display: none; }
.pl.hit { background: color-mix(in srgb, var(--mod) 18%, transparent); }
.pl.cur { box-shadow: inset 3px 0 0 var(--del); background: color-mix(in srgb, var(--del) 22%, transparent); }
.pl.hit.cur { box-shadow: inset 3px 0 0 var(--mod); }
@media (max-width: 820px) { .pl-find { width: 100%; order: 5; } .pipe-failed { margin: 12px; } }
.pipe-logbar .pl-find { width: 220px !important; flex: none; }
.history-bar .graph-search { min-width: 0; flex: 1 1 140px; }
.sheet-host.docked .history-bar { flex-wrap: wrap; }
@media (max-width: 820px) { .pipe-logbar .pl-find { width: 100% !important; } }
/* the branch sits right after the repository name: one "where you are" group */
@media (min-width: 821px) { body.wide .repo-line > .repo-btn.grow { flex: 0 1 auto; } body.wide header { gap: 8px; } }


/* =========================================================================
   unslop polish (unslop by Damir Sokolovsky, @heydamir, CC BY 4.0)
   Direction: exact, quiet, quick. A night transit map: the graph lines and branch labels carry the
   color; the chrome stays grey with one blue accent. Signature: a branch keeps its lane color everywhere.
   ========================================================================= */
/* section labels: sentence case, muted, a little closer to their own items */
.side-head, .section-head, .cfg-group, .menu .label, .res-label { font-size: 12px; font-weight: 500; color: var(--t3); }
.side-head { padding: 12px 12px 4px; }
.section-head { padding: 16px 16px 8px; }
#side .item { min-height: 32px; }

/* counts are quiet mono text, not bubbles */
.tab .badge, .section-head .count, .side-head .count { background: none !important; border: 0 !important; padding: 0 0 0 4px !important; min-width: 0 !important; color: var(--t3) !important; font: 500 12px/1 var(--mono, ui-monospace, monospace) !important; font-variant-numeric: tabular-nums; }
.tab.active .badge { color: var(--t2) !important; }
.tb-count { background: none; color: var(--ren); padding: 0 0 0 2px; min-width: 0; height: auto; font: 600 12px/1 var(--mono, ui-monospace, monospace); font-variant-numeric: tabular-nums; }
.toolbar .icon-btn.tb-hot { background: var(--card); border-color: color-mix(in srgb, var(--ren) 45%, var(--line)); }

/* status chips: neutral text tags; the lane colors stay with branches */
.pill.role { background: var(--raised) !important; color: var(--t2) !important; border: 1px solid var(--line) !important; border-radius: 4px !important; font-weight: 500 !important; }
.menu-badge { display: none; }

/* one accent action per screen: row actions in lists are secondary */
.review-actions .btn.primary { background: var(--card); color: var(--t1); border-color: var(--line); }

/* radius by size, not pills everywhere */
.branch-chip { border-radius: 8px; }
.ci { border-radius: 6px; }
.date-float { border-radius: 6px; }
.pl-live { border-radius: 4px; }
.ai-title { gap: 0; }

/* toasts: at most three on screen, the newest last */
#toasts > .toast:nth-last-child(n + 4) { display: none; }

/* motion: a colour change, no overshoot */
.toolbar .icon-btn.done svg { animation: none; }
.toolbar .icon-btn.working[data-op="pull"] svg, .toolbar .icon-btn.working[data-op="fetch"] svg, .toolbar .icon-btn.working[data-op="push"] svg { animation-duration: .9s; }
@keyframes tbDown { 0%, 100% { transform: translateY(-1.5px); } 50% { transform: translateY(1.5px); } }
@keyframes tbUp { 0%, 100% { transform: translateY(1.5px); } 50% { transform: translateY(-1.5px); } }

/* MR dialog: the people hint is one line of text, not three columns */
.pp-note { display: block !important; font-size: 12px; line-height: 16px; margin-bottom: 8px; }
.tab .badge { display: inline-flex; align-items: center; height: auto !important; line-height: inherit !important; vertical-align: baseline; }

/* ---------- tooltip: our own, in the theme, instead of the browser's ---------- */
.tip { position: fixed; z-index: 10000; max-width: min(360px, calc(100vw - 12px)); padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line-hi); background: var(--raised); color: var(--t1); box-shadow: var(--shadow); font-size: 12px; line-height: 16px; white-space: pre-line; overflow-wrap: anywhere; pointer-events: none; opacity: 0; transform: translateY(-2px); transition: opacity .12s cubic-bezier(.22, 1, .36, 1), transform .12s cubic-bezier(.22, 1, .36, 1); }
.tip[data-side="above"] { transform: translateY(2px); }
.tip.on { opacity: 1; transform: none; }
html.light .tip { background: #fff; }
@media (prefers-reduced-motion: reduce) { .tip { transition: none; } }

/* ahead/behind: to push green, to pull amber, gone separate ways red */
.sync-ab { display: inline-flex; gap: 6px; font-size: 12px; font-variant-numeric: tabular-nums; }
.ab-up { color: var(--add); }
.ab-down { color: var(--mod); }
.tb-count.ab-up { color: var(--add); }
.tb-count.ab-down { color: var(--mod); }
.sync-ab.diverged .ab-up, .sync-ab.diverged .ab-down, .toolbar .icon-btn.diverged .tb-count { color: var(--del); }
.toolbar .icon-btn.tb-hot { border-color: var(--line-hi); }
.toolbar .icon-btn.tb-hot.diverged { border-color: color-mix(in srgb, var(--del) 50%, var(--line)); }

/* ---------- merge request list: a row opens its detail page ---------- */
.review-row { cursor: pointer; }
.review-row:hover { background: var(--hover); }
.review-row:focus-visible { outline: 2px solid var(--ren); outline-offset: -2px; }
.review-actions { display: flex; align-items: center; gap: 4px; }
.review-chev { color: var(--t3); display: inline-flex; }
.review-row:hover .review-chev { color: var(--t2); }

/* ---------- merge request detail ---------- */
.sheet.mr-detail { width: min(1080px, 86%); }
.mrd { display: flex; flex-direction: column; min-height: 100%; }
.mrd-head { padding: 20px 24px 12px; }
.mrd-title { margin: 0 0 8px; font-size: 16px; font-weight: 600; line-height: 24px; color: var(--t1); }
.mrd-ref { color: var(--t3); font-weight: 400; }
.mrd-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; font-size: 12px; }
.mrd-state { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-weight: 600; border: 1px solid var(--line); background: var(--raised); color: var(--t1); }
.mrd-state.s-open { border-color: color-mix(in srgb, var(--add) 50%, var(--line)); color: var(--add); }
.mrd-state.s-merged { border-color: color-mix(in srgb, #b48be8 50%, var(--line)); color: #b48be8; }
.mrd-state.s-closed { border-color: color-mix(in srgb, var(--del) 50%, var(--line)); color: var(--del); }
.mrd-route { display: inline-flex; align-items: center; gap: 4px; color: var(--t3); }
.mrd-tabs { display: flex; gap: 4px; padding: 0 24px; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; background: var(--bg); }
.mrd-tab { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--t2); font: inherit; font-size: 13px; cursor: pointer; }
.mrd-tab:hover { color: var(--t1); }
.mrd-tab.on { color: var(--t1); border-bottom-color: var(--ren); font-weight: 500; }
.mrd-count { color: var(--t3); font-size: 12px; }
.mrd-pane { flex: 1; }
.mrd-overview { display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 24px; padding: 20px 24px 24px; }
.mrd-desc { padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.mrd-sec { padding: 16px 0 8px !important; }
.mrd-thread { display: flex; flex-direction: column; gap: 12px; }
.mrd-comment { display: flex; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
.mrd-comment.k-approved { border-color: color-mix(in srgb, var(--add) 35%, var(--line)); }
.mrd-comment.k-changes { border-color: color-mix(in srgb, var(--del) 35%, var(--line)); }
.mrd-c-head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; font-size: 12px; }
.mrd-c-file { padding: 0 6px; border-radius: 4px; background: var(--raised); }
.mrd-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; }
.mrd-tag.ok { color: var(--add); }
.mrd-tag.bad { color: var(--del); }
.mrd-none { padding: 4px 0; }
.mrd-avatar { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; background: var(--raised); border: 1px solid var(--line); color: var(--t2); font-size: 11px; font-weight: 600; }
.mrd-side { display: flex; flex-direction: column; gap: 16px; }
.mrd-box { display: flex; flex-direction: column; gap: 8px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.mrd-box:last-child { border-bottom: 0; }
.mrd-label { font-size: 12px; color: var(--t3); }
.mrd-big { font-size: 14px; font-weight: 500; color: var(--t1); }
.mrd-person { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.mrd-rs { display: inline-flex; color: var(--t3); }
.mrd-rs.ok { color: var(--add); }
.mrd-rs.bad { color: var(--del); }
.mrd-labels { display: flex; flex-wrap: wrap; gap: 4px; }
.mrd-commits { display: flex; flex-direction: column; padding: 8px 12px 24px; }
.mrd-commit { display: flex; align-items: center; gap: 12px; height: 36px; padding: 0 12px; border: 0; border-radius: 8px; background: none; color: var(--t1); font: inherit; font-size: 13px; text-align: left; cursor: pointer; }
.mrd-commit:hover { background: var(--hover); }
.mrd-when { width: 72px; text-align: right; }
.mrd-bar { position: sticky; bottom: 0; display: flex; align-items: center; gap: 8px; padding: 12px 24px; border-top: 1px solid var(--line); background: var(--raised); margin-top: auto; }
/* markdown */
.md { font-size: 13px; line-height: 20px; color: var(--t1); overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 8px; }
.md h3, .md h4, .md h5, .md h6 { margin: 16px 0 8px; font-size: 14px; font-weight: 600; }
.md h3 { font-size: 15px; }
.md ul, .md ol { margin: 0 0 8px; padding-left: 20px; }
.md li { margin: 2px 0; }
.md code { padding: 1px 4px; border-radius: 4px; background: var(--raised); font: 12px var(--mono, ui-monospace, monospace); }
.md pre { margin: 0 0 8px; padding: 12px; border-radius: 8px; background: var(--raised); border: 1px solid var(--line); overflow: auto; }
.md pre code { padding: 0; background: none; }
.md blockquote { margin: 0 0 8px; padding: 0 12px; border-left: 2px solid var(--line-hi); color: var(--t2); }
.md a { color: var(--ren); text-decoration: none; }
.md a:hover { text-decoration: underline; }
@media (max-width: 820px) {
  .sheet.mr-detail { width: 100%; }
  .mrd-overview { grid-template-columns: 1fr; padding: 16px; }
  .mrd-head, .mrd-tabs, .mrd-bar { padding-left: 16px; padding-right: 16px; }
  .mrd-bar { flex-wrap: wrap; }
  .mrd-bar > .grow { flex-basis: 100%; }
}
/* toasts sit above the decision bar of a detail page */
body:has(.mrd-bar) #toasts { bottom: 72px; }

/* merge request detail: long names wrap inside their card; narrow pages stack the side facts on top */
.mrd-c-head b, .mrd-person .grow { min-width: 0; overflow-wrap: anywhere; }
.mrd-comment > .grow { min-width: 0; }
.mrd-comment .md { overflow-wrap: anywhere; }
@container (max-width: 820px) {
  .mrd-overview { grid-template-columns: 1fr; gap: 16px; }
  .mrd-side { order: -1; flex-direction: row; flex-wrap: wrap; gap: 12px 24px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
  .mrd-box { padding-bottom: 0; border-bottom: 0; min-width: 140px; }
  .mrd-bar > .grow { display: none; }
  .mrd-bar { justify-content: flex-end; }
}

/* AI commit: Generate sits on the Message field it fills */
.ai-msg-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.ai-msg-head label { margin: 0; }
.ai-gen { min-width: 92px; justify-content: center; }

/* right-sidebar panel: no branches drawer button, so the toolbar starts at the edge */
.side-panel .repo-line .toolbar { margin-left: 0 !important; width: 100% !important; flex-basis: 100% !important; }
.side-panel .repo-line .toolbar > button { height: 32px; }
.side-panel header { padding: 8px 12px; }

/* tab counts: small flat tags, each colour says what it counts */
.tab .badge { display: inline-flex !important; align-items: center; justify-content: center; min-width: 18px !important; height: 18px !important; padding: 0 5px !important; margin-left: 6px; border-radius: 4px !important; border: 0 !important; font: 600 11px/18px var(--mono, ui-monospace, monospace) !important; font-variant-numeric: tabular-nums; background: var(--raised) !important; color: var(--t2) !important; }
.tab .badge.tb-changes { background: color-mix(in srgb, var(--mod) 18%, transparent) !important; color: var(--mod) !important; }
.tab .badge.tb-reviews { background: color-mix(in srgb, var(--ren) 20%, transparent) !important; color: var(--ren) !important; }
.tab .badge.tb-stash { background: color-mix(in srgb, var(--fg) 10%, transparent) !important; color: var(--t2) !important; }

/* Generate: an outlined accent button with its own icon, so Commit stays the one solid action */
.btn.ai-gen { gap: 6px; height: 30px; padding: 0 12px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--ren) 55%, var(--line)); background: color-mix(in srgb, var(--ren) 10%, transparent); color: var(--ren); font-weight: 500; transition: background-color .15s, border-color .15s, color .15s; }
.btn.ai-gen:hover:not(:disabled) { background: color-mix(in srgb, var(--ren) 18%, transparent); border-color: var(--ren); color: var(--t1); }
.btn.ai-gen:focus-visible { outline: 2px solid color-mix(in srgb, var(--ren) 60%, transparent); outline-offset: 2px; }
.btn.ai-gen svg { color: currentColor; }
.btn.ai-gen.stop { border-color: color-mix(in srgb, var(--del) 55%, var(--line)); background: color-mix(in srgb, var(--del) 10%, transparent); color: var(--del); }

/* commit tab: a section head folds its list */
.fold-head { cursor: pointer; user-select: none; }
.fold-head:hover { color: var(--t1); }
.fold-head:focus-visible { outline: 2px solid var(--ren); outline-offset: -2px; }
.fold-chev { display: inline-flex; color: var(--t3); transition: transform .15s cubic-bezier(.22, 1, .36, 1); }
.fold-head.folded .fold-chev { transform: rotate(-90deg); }

/* narrow (sidebar, phone): the button's own arrow icon says the direction, the count is just the number */
.side-panel .tb-arrow { display: none; }
@media (max-width: 820px) { .tb-arrow { display: none; } }

/* narrow Review & MR: title on its own line, tags under it, the open/chevron stay on the row */
@media (max-width: 560px) {
  .review-row { flex-wrap: nowrap !important; align-items: center !important; gap: 10px; padding: 12px; }
  .review-title { flex-wrap: wrap; row-gap: 4px; }
  .review-title > .ellipsis { flex: 1 1 100%; min-width: 0; }
  .review-meta { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .review-actions { flex: none; align-self: center; }
  .review-icon { align-self: flex-start; }
}
.side-panel .reviews .history-bar { flex-wrap: wrap; gap: 8px; padding: 12px; }
.side-panel .reviews .segmented { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.side-panel .reviews .segmented::-webkit-scrollbar { display: none; }

/* right-sidebar panel at any width: repository, then the toolbar, then the branch, each on its own row */
.side-panel header { display: block; }
.side-panel .repo-line { display: flex; flex-wrap: wrap; align-items: center; row-gap: 8px; width: 100%; }
.side-panel .repo-line .repo-btn { flex: 1 1 auto; max-width: 100%; }
.side-panel .repo-line .toolbar { order: 3; display: flex; gap: 6px; }
.side-panel .repo-line .toolbar > button { flex: 1 1 0; min-width: 0; justify-content: center; max-width: 64px; }
.side-panel #branchLine { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; width: auto; flex: none; }
/* every tab visible: they wrap instead of hiding off the edge */
.side-panel nav.tabs { flex-wrap: wrap; overflow: visible !important; -webkit-mask-image: none !important; mask-image: none !important; row-gap: 4px; padding: 8px 12px; }
.side-panel nav.tabs .tab { flex: none; }

/* merge request overview: description and facts side by side, activity full width below */
.mrd-overview { grid-template-columns: minmax(0, 1fr) 260px; grid-template-areas: 'main side' 'act act'; align-items: start; gap: 16px 20px; }
.mrd-main { grid-area: main; min-width: 0; }
.mrd-side { grid-area: side; padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
.mrd-activity { grid-area: act; min-width: 0; }
.mrd-desc { padding: 16px 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
.mrd-desc > .mrd-label { margin-bottom: 8px; }
.mrd-activity .mrd-sec { padding-top: 4px !important; }
@container (max-width: 820px) {
  .mrd-overview { grid-template-columns: 1fr; grid-template-areas: 'side' 'main' 'act'; }
  .mrd-side { flex-direction: row; flex-wrap: wrap; }
}
@media (max-width: 820px) { .mrd-overview { grid-template-columns: 1fr; grid-template-areas: 'side' 'main' 'act'; } }

/* switching projects: the whole page waits in skeleton form */
.skeleton-bar-row { display: flex; gap: 8px; padding: 0 16px 12px; }
.skeleton-bar-row .bar, .skeleton-chip { display: block; height: 28px; border-radius: 8px; background: linear-gradient(90deg, var(--card) 25%, var(--card-hi) 50%, var(--card) 75%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
.skeleton-bar-row .bar.wide { flex: 1; }
.skeleton-bar-row .bar.short { width: 120px; }
.skeleton-chip { width: 110px; }
.side-skel { padding-top: 8px; }
body.is-loading-repo .toolbar .icon-btn { opacity: .5; pointer-events: none; }
body.is-loading-repo nav.tabs { opacity: .6; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .skeleton-bar-row .bar, .skeleton-chip { animation: none; } }

/* narrow: icons only, but a Pull or Push with commits waiting says so in words and takes more room */
.side-panel .tb-label { display: none; }
.side-panel .toolbar .icon-btn.tb-hot { flex: 2.4 1 0 !important; max-width: none !important; gap: 6px; border-color: color-mix(in srgb, var(--add) 45%, var(--line)); background: color-mix(in srgb, var(--add) 10%, var(--card)); }
.side-panel .toolbar .icon-btn.tb-hot[data-op="pull"] { border-color: color-mix(in srgb, var(--mod) 45%, var(--line)); background: color-mix(in srgb, var(--mod) 10%, var(--card)); }
.side-panel .toolbar .icon-btn.tb-hot .tb-label { display: inline; font-size: 12px; font-weight: 500; }
@media (max-width: 820px) { body.wide .toolbar .icon-btn.tb-hot .tb-label { display: inline; } body.wide .repo-line .toolbar > button.tb-hot { flex: 2 1 0; } }

/* Review & MR filters wrap onto a second line instead of hiding off the edge */
.side-panel .reviews .segmented { flex-wrap: wrap; overflow: visible !important; row-gap: 4px; }
.side-panel .reviews .segmented button { flex: 1 1 auto; }
@media (max-width: 820px) { .reviews .segmented { flex-wrap: wrap; overflow: visible !important; row-gap: 4px; } .reviews .segmented button { flex: 1 1 auto; } }

/* a Pull/Push with work waiting fits its words and number; the icon buttons give way instead */
.side-panel .toolbar .icon-btn.tb-hot { flex: 0 0 auto !important; padding: 0 10px !important; overflow: visible; }
.side-panel .toolbar .icon-btn.tb-hot .tb-count { margin-left: 2px; }
.side-panel .toolbar > button:not(.tb-hot) { min-width: 28px; }

/* narrow Review & MR filters: separate chips that wrap neatly, not one box broken over two lines */
.side-panel .reviews .rv-filter, .reviews .rv-filter.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0; border: 0; background: none; }
.side-panel .reviews .rv-filter button { flex: none !important; height: 30px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--t2); }
.side-panel .reviews .rv-filter button.on { border-color: color-mix(in srgb, var(--ren) 55%, var(--line)); background: color-mix(in srgb, var(--ren) 14%, var(--card)); color: var(--t1); }
@media (max-width: 820px) {
  .reviews .rv-filter { display: flex; flex-wrap: wrap; gap: 6px; padding: 0; border: 0; background: none; }
  .reviews .rv-filter button { flex: none !important; height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--t2); }
  .reviews .rv-filter button.on { border-color: color-mix(in srgb, var(--ren) 55%, var(--line)); background: color-mix(in srgb, var(--ren) 14%, var(--card)); color: var(--t1); }
}

/* the sidebar toolbar never runs past the edge: icon buttons shrink (no side padding), and if even that
   is not enough the row wraps instead of cutting a button off */
.side-panel .repo-line .toolbar { flex-wrap: wrap; row-gap: 6px; min-width: 0; max-width: 100%; box-sizing: border-box; }
.side-panel .repo-line .toolbar > button:not(.tb-hot) { flex: 1 1 32px !important; min-width: 30px !important; max-width: 64px; padding: 0 !important; }
.side-panel .repo-line .toolbar > .tb-sep { display: none; }

/* narrow full tab (body.compact): the same rules as the sidebar panel */
body.compact .tb-label { display: none; }
body.compact .repo-line .toolbar { flex-wrap: wrap; row-gap: 6px; min-width: 0; }
body.compact .repo-line .toolbar > button:not(.tb-hot) { flex: 1 1 32px !important; min-width: 30px !important; max-width: 64px; padding: 0 !important; }
body.compact .repo-line .toolbar > .tb-sep { display: none; }
body.compact .toolbar .icon-btn.tb-hot { flex: 0 0 auto !important; max-width: none !important; padding: 0 10px !important; gap: 6px; overflow: visible; border-color: color-mix(in srgb, var(--add) 45%, var(--line)); background: color-mix(in srgb, var(--add) 10%, var(--card)); }
body.compact .toolbar .icon-btn.tb-hot[data-op="pull"] { border-color: color-mix(in srgb, var(--mod) 45%, var(--line)); background: color-mix(in srgb, var(--mod) 10%, var(--card)); }
body.compact .toolbar .icon-btn.tb-hot .tb-label { display: inline; font-size: 12px; font-weight: 500; }
body.compact .toolbar .icon-btn.tb-hot .tb-count { margin-left: 2px; }
body.compact .tb-arrow { display: none; }
body.compact nav.tabs { flex-wrap: wrap; overflow: visible !important; -webkit-mask-image: none !important; mask-image: none !important; row-gap: 4px; padding: 8px 12px; }
body.compact nav.tabs .tab { flex: none; }
.mrd-when-small { flex: none; font-size: 12px; }

/* image diff preview */
.img-preview { display: grid; gap: 14px; padding: 14px; }
.img-preview.two { grid-template-columns: 1fr 1fr; }
body.compact .img-preview.two, .side-panel .img-preview.two { grid-template-columns: 1fr; }
.img-side { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.img-label { font-size: 11px; font-weight: 600; color: var(--muted, #999); text-transform: uppercase; letter-spacing: .04em; }
.img-label.del { color: var(--del, #e5534b); }
.img-label.add { color: var(--add, #57ab5a); }
.img-frame { border: 1px solid var(--border, rgba(127,127,127,.25)); border-radius: 8px; padding: 10px; display: flex; align-items: center; justify-content: center; min-height: 120px;
  background-color: #fff; background-image: conic-gradient(#e6e6e6 25%, #fff 0 50%, #e6e6e6 0 75%, #fff 0); background-size: 16px 16px; }
.img-frame img { max-width: 100%; max-height: 70vh; object-fit: contain; display: block; cursor: zoom-in; }
.img-meta { font-size: 11.5px; }

/* Review & MR: tabs with counts, selection, row actions, bulk bar, animations */
.rv-tabs button { display: inline-flex; align-items: center; gap: 6px; }
.rv-n { font-size: 10.5px; min-width: 18px; padding: 0 5px; border-radius: 9px; background: color-mix(in srgb, currentColor 14%, transparent); text-align: center; line-height: 16px; }
.rv-n.hot { background: color-mix(in srgb, var(--accent, #4c8dff) 30%, transparent); color: var(--accent, #4c8dff); }
.rv-head { display: flex; align-items: center; gap: 8px; }
.rv-check { margin: 0; width: 14px; height: 14px; accent-color: var(--accent, #4c8dff); cursor: pointer; flex: none; }
.review-row .rv-check { opacity: .55; transition: opacity .15s; }
.review-row:hover .rv-check, .review-row.sel .rv-check, .review-row .rv-check:focus-visible { opacity: 1; }
.review-row.sel { background: color-mix(in srgb, var(--accent, #4c8dff) 10%, transparent); box-shadow: inset 2px 0 0 var(--accent, #4c8dff); }
.review-actions { display: flex; align-items: center; gap: 6px; }
.review-actions .btn.sm { padding-left: 8px; padding-right: 9px; }
.side-panel .review-actions .btn.sm, body.compact .review-actions .btn.sm { font-size: 0; gap: 0; padding: 0 7px; }
.rv-appr { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: var(--muted, #999); padding: 0 6px; border-radius: 9px; border: 1px solid var(--border, rgba(127,127,127,.25)); }
.rv-appr.ok { color: var(--add, #57ab5a); border-color: color-mix(in srgb, var(--add, #57ab5a) 45%, transparent); }
.pill.rv-mine-ok { display: inline-flex; align-items: center; gap: 3px; color: var(--add, #57ab5a); background: color-mix(in srgb, var(--add, #57ab5a) 14%, transparent); }
.rv-result:empty { display: none; }
.rv-result { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; }
.review-row { transition: background .25s, height .3s ease, opacity .3s ease, padding .3s ease, margin .3s ease; }
.review-row.rv-busy { opacity: .7; pointer-events: none; }
.review-row.rv-done-approve, .review-row.rv-done-unapprove { background: color-mix(in srgb, var(--add, #57ab5a) 16%, transparent); }
.review-row.rv-done-approve .rv-result { color: var(--add, #57ab5a); }
.review-row.rv-done-merge { background: color-mix(in srgb, #8957e5 20%, transparent); }
.review-row.rv-done-merge .rv-result { color: #a371f7; }
.review-row.rv-done .review-actions .btn.sm { display: none; }
.review-row.rv-done .rv-result { animation: rv-pop .35s ease; }
.review-row.rv-leave { height: 0 !important; opacity: 0; padding-top: 0; padding-bottom: 0; margin: 0; overflow: hidden; border-width: 0; }
.rv-shake { animation: rv-shake .45s ease; }
@keyframes rv-pop { 0% { transform: scale(.6); opacity: 0 } 70% { transform: scale(1.12) } 100% { transform: scale(1); opacity: 1 } }
@keyframes rv-shake { 0%, 100% { transform: translateX(0) } 20%, 60% { transform: translateX(-4px) } 40%, 80% { transform: translateX(4px) } }
.rv-bulk { position: sticky; bottom: 0; z-index: 3; display: none; align-items: center; gap: 8px; padding: 10px 12px; margin-top: 8px; border-top: 1px solid var(--border, rgba(127,127,127,.25)); background: var(--bg, #111); box-shadow: 0 -8px 20px rgba(0,0,0,.25); }
.rv-bulk.on { display: flex; animation: rv-up .2s ease; }
.rv-bulk-n { font-weight: 600; }
@keyframes rv-up { from { transform: translateY(100%); opacity: 0 } to { transform: none; opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .review-row, .rv-bulk.on, .rv-result, .rv-shake { animation: none !important; transition: none !important; } }

/* merge widget on the detail page (like GitLab's) */
.mrw { margin-top: 16px; border: 1px solid var(--border, rgba(127,127,127,.25)); border-radius: 10px; overflow: hidden; transition: box-shadow .3s; }
.mrw-row { display: flex; align-items: center; gap: 10px; padding: 12px 14px; flex-wrap: wrap; }
.mrw-row + .mrw-row { border-top: 1px solid var(--border, rgba(127,127,127,.25)); }
.mrw-ic { flex: none; width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: var(--muted, #999); border: 1px solid var(--border, rgba(127,127,127,.3)); }
.mrw-row.ok .mrw-ic, .mrw-row.ci-passed .mrw-ic { color: var(--add, #57ab5a); border-color: color-mix(in srgb, var(--add, #57ab5a) 50%, transparent); }
.mrw-row.ci-failed .mrw-ic, .mrw-row.blocked .mrw-ic { color: var(--del, #e5534b); border-color: color-mix(in srgb, var(--del, #e5534b) 50%, transparent); }
.mrw-row.ci-running .mrw-ic, .mrw-row.auto .mrw-ic { color: #d29922; border-color: color-mix(in srgb, #d29922 50%, transparent); }
.mrw-row.merged .mrw-ic { color: #a371f7; border-color: color-mix(in srgb, #a371f7 50%, transparent); }
.mrw-row .grow { min-width: 0; }
.mrw-you { color: var(--add, #57ab5a); }
.mrw-merge { background: color-mix(in srgb, var(--fg, #fff) 3%, transparent); }
.mrw-merge-body { display: flex; flex-direction: column; gap: 6px; }
.mrw-opts { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; }
.mrw-opts .check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.mrw-merge-btn { min-width: 84px; }
.mrw.mrw-done-approve { box-shadow: 0 0 0 2px color-mix(in srgb, var(--add, #57ab5a) 60%, transparent); }
.mrw.mrw-done-merge { box-shadow: 0 0 0 2px color-mix(in srgb, #a371f7 60%, transparent); }

/* merge conflicts: Current (green, HEAD) and Incoming (blue), each with its branch name */
.side-chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 3px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); background: var(--card); color: var(--t1); min-width: 0; flex: 0 1 auto; }
.side-chip .side-k { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 1px 7px; border-radius: 999px; color: var(--ref-head-ink, #10131a); flex: none; }
.side-chip .side-n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-chip.current { border-color: color-mix(in srgb, var(--add) 40%, var(--line)); }
.side-chip.current .side-k { background: var(--add); }
.side-chip.incoming { border-color: color-mix(in srgb, var(--ren) 45%, var(--line)); }
.side-chip.incoming .side-k { background: var(--ren); }
.cf-route { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.cf-route > svg, .cf-route > span:not(.side-chip) { flex: none; color: var(--t3); }
/* in the banner: one line, each name in full while it fits, then shortened with … */
.cf-route.sm { margin-left: 8px; flex-wrap: nowrap; flex: 1 1 auto; overflow: hidden; }
.cf-route.sm .side-chip { font-size: 11px; }
.cf-hub { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.cf-lead { margin: 0; color: var(--muted, #aaa); line-height: 1.5; }
.cf-files { display: flex; flex-direction: column; border: 1px solid var(--border, rgba(127,127,127,.25)); border-radius: 10px; overflow: hidden; }
.cf-file { display: flex; align-items: center; gap: 8px; padding: 10px 12px; color: #d29922; }
.cf-file + .cf-file { border-top: 1px solid var(--border, rgba(127,127,127,.25)); }
.cf-file .cf-name { color: var(--fg, inherit); text-align: left; font-family: var(--mono, monospace); min-width: 0; }
.side-panel .cf-file, body.compact .cf-file { flex-wrap: wrap; }
.cf-done { color: var(--add, #3fb950); }
.resolver { padding: 12px 16px; display: flex; flex-direction: column; gap: 14px; }
.res-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; position: sticky; top: 0; z-index: 2; padding: 8px 0; background: var(--bg, #111); }
.res-progress { font-size: 12px; color: var(--muted, #aaa); }
.res-progress.ok { color: var(--add, #3fb950); font-weight: 600; }
.res-block { border: 1px solid var(--border, rgba(127,127,127,.25)); border-radius: 10px; overflow: hidden; transition: border-color .2s; }
.res-block.done { border-color: color-mix(in srgb, var(--add, #3fb950) 45%, transparent); }
.res-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border, rgba(127,127,127,.25)); flex-wrap: wrap; }
.res-sides { display: grid; grid-template-columns: 1fr 1fr; }
.side-panel .res-sides, body.compact .res-sides { grid-template-columns: 1fr; }
.res-side { min-width: 0; cursor: pointer; border-left: 3px solid transparent; transition: background .15s, opacity .2s; }
.res-side + .res-side { border-left-color: transparent; box-shadow: inset 1px 0 0 var(--border, rgba(127,127,127,.25)); }
.res-side.current { border-left-color: #2f9e44; }
.res-side.incoming { border-left-color: #3b6fd8; }
.res-side:hover { background: color-mix(in srgb, var(--fg, #fff) 4%, transparent); }
.res-side-head { display: flex; align-items: center; gap: 6px; padding: 6px 10px; font-size: 12px; min-width: 0; }
.res-side-head .side-k { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.res-side.current .side-k { color: #3fb950; }
.res-side.incoming .side-k { color: #6ea0ff; }
.res-side-head .side-n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted, #aaa); min-width: 0; }
.res-pick { display: none; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--add, #3fb950); }
.res-side .res-code { margin: 0; padding: 8px 12px; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
.res-side.current .res-code { background: color-mix(in srgb, #2f9e44 9%, transparent); }
.res-side.incoming .res-code { background: color-mix(in srgb, #3b6fd8 9%, transparent); }
.res-block[data-c="ours"] .res-side.incoming, .res-block[data-c="theirs"] .res-side.current { opacity: .45; }
.res-block[data-c="ours"] .res-side.current .res-pick, .res-block[data-c="theirs"] .res-side.incoming .res-pick, .res-block[data-c="both"] .res-pick { display: inline-flex; }
.res-result-box { padding: 8px 12px 12px; border-top: 1px solid var(--border, rgba(127,127,127,.25)); }
.res-result-box .res-label { font-size: 11.5px; font-weight: 600; margin-bottom: 6px; }
.res-result { width: 100%; box-sizing: border-box; font-size: 12px; resize: vertical; }

/* conflicts page: one step for all files, then file by file, then what is done */
.cf-all { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--fg, #fff) 4%, transparent); border: 1px solid var(--border, rgba(127,127,127,.25)); }
.cf-all-k { font-weight: 600; margin-right: 4px; }
.cf-all .cf-cur { border-color: color-mix(in srgb, #2f9e44 55%, transparent); }
.cf-all .cf-inc { border-color: color-mix(in srgb, #3b6fd8 60%, transparent); }
.cf-state { font-size: 11.5px; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.cf-state:empty { display: none; }
.cf-file.cf-working { background: color-mix(in srgb, #a371f7 10%, transparent); }
.cf-file.cf-ok { color: var(--add, #3fb950); }
.cf-file.cf-ok .cf-state { color: var(--add, #3fb950); }
.cf-file.cf-ai .cf-state { color: #a371f7; }
.cf-ready { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 10px; color: var(--add, #3fb950); font-weight: 600; background: color-mix(in srgb, var(--add, #3fb950) 10%, transparent); border: 1px solid color-mix(in srgb, var(--add, #3fb950) 40%, transparent); }
.res-ai { min-height: 160px; }

/* review pass: profile cards give the name and email the full width; buttons go underneath */
.idp { flex-wrap: wrap; align-items: flex-start; }
.idp-actions { width: 100%; justify-content: flex-start; padding-top: 8px; border-top: 1px solid var(--line); }
.idp-mail { white-space: normal; word-break: break-all; }
/* the settings Save bar stays at the bottom of the view; toasts sit above it */
.cfg-save { position: sticky; bottom: 0; z-index: 2; padding: 10px 16px; margin: 8px -16px 0; background: var(--bg); border-top: 1px solid var(--line); box-shadow: 0 -8px 18px rgba(0,0,0,.18); }
.cfg-save-note { font-size: 11.5px; }
body:has(.cfg-save) #toasts { bottom: 64px; }
/* reflog: labelled buttons */
.view .hover-actions .btn.sm { white-space: nowrap; }
.side-panel .view .hover-actions .btn.sm, body.compact .view .hover-actions .btn.sm { font-size: 0; gap: 0; padding: 0 7px; }

/* the graph's search bar stays at the top while the list scrolls */
#main > .view > .history-bar:first-child { position: sticky; top: 0; z-index: 6; background: var(--bg); padding-top: 8px; margin-top: -8px; box-shadow: 0 1px 0 var(--line); }
.graph-search-wrap { position: relative; flex: 1; min-width: 0; display: flex; }
.graph-search-wrap .graph-search { flex: 1; padding-right: 28px; }
.graph-search-wrap .search-clear { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); }

/* ---------- v0.7: conflicts need fewer choices ---------- */
.res-auto { display: none; align-items: center; gap: 3px; color: var(--add); background: color-mix(in srgb, var(--add) 14%, transparent); }
.res-block[data-c="auto"] .res-auto { display: inline-flex; }
.res-block[data-c="auto"] .res-side { opacity: .55; }
.res-side.base { display: none; border-left-color: var(--t3); }
.resolver.show-base .res-sides { grid-template-columns: 1fr 1fr 1fr; }
.resolver.show-base .res-side.base { display: block; }
.res-side.base .side-k { color: var(--t2); }
.res-side.base .res-code { background: color-mix(in srgb, var(--fg) 4%, transparent); }
.side-panel .resolver.show-base .res-sides, body.compact .resolver.show-base .res-sides { grid-template-columns: 1fr; }
.res-top .btn.on { border-color: var(--ren); color: var(--ren); }
.cf-auto { margin-left: 4px; }

/* reset: three choices, each explained */
.choice-dialog { width: min(520px, calc(100vw - 32px)); }
.choice-list { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
.choice { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); cursor: pointer; }
.choice input { margin-top: 3px; }
.choice.on { border-color: var(--ren); background: var(--sel); }
.choice.danger.on { border-color: var(--del); background: color-mix(in srgb, var(--del) 10%, transparent); }
.choice b .dim { font-weight: 400; font-size: 11px; }
.choice-what { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: var(--r-sm); background: var(--card); color: var(--t2); font-size: 12px; }

/* git command log */
.cmd-log { padding: 8px 12px 16px; }
.cmd-lead { margin: 4px 4px 10px; font-size: 12px; }
.cmd-row { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: var(--r-sm); }
.cmd-row:hover { background: var(--hover); }
.cmd-row.bad .cmd-c { color: var(--del); }
.cmd-c { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.cmd-t, .cmd-ms { font-size: 11px; white-space: nowrap; }
.cmd-toast { display: flex; flex-direction: column; gap: 2px; }
.cmd-toast code { font-family: var(--mono); font-size: 11.5px; }
.toast-act { margin-left: 8px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line-hi); background: var(--card-hi); color: var(--t1); cursor: pointer; pointer-events: auto; font: inherit; font-weight: 600; }
.toast-act:hover { border-color: var(--ren); }
.tab-intro { margin: 0 16px 8px; font-size: 12px; line-height: 1.5; }

/* interactive rebase */
.rb-dialog { width: min(900px, calc(100vw - 32px)); }
.rb-list { display: flex; flex-direction: column; gap: 6px; max-height: 55vh; overflow: auto; margin: 10px 0; }
.rb-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-left: 3px solid var(--ren); border-radius: var(--radius); background: var(--card); outline: none; }
.rb-row:focus-visible { box-shadow: var(--focus); }
.rb-row.dragging { opacity: .4; }
.rb-row.drop-here { border-top: 2px solid var(--ren); }
.rb-row.a-reword { border-left-color: var(--mod); }
.rb-row.a-squash, .rb-row.a-fixup { border-left-color: #a371f7; margin-left: 22px; }
.rb-row.a-drop { border-left-color: var(--del); opacity: .55; }
.rb-row.a-drop .rb-subject { text-decoration: line-through; }
.rb-grip { cursor: grab; color: var(--t3); user-select: none; font-size: 15px; }
.rb-hash { font-size: 11.5px; }
.rb-main { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.rb-msg { width: 100%; }
.rb-hint { font-size: 11px; color: #a371f7; }
.rb-acts { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; flex: none; }
.rb-act { border: 0; background: transparent; color: var(--t2); padding: 3px 8px; font: inherit; font-size: 11.5px; cursor: pointer; }
.rb-act + .rb-act { border-left: 1px solid var(--line); }
.rb-act:disabled { opacity: .35; cursor: default; }
.rb-act.on.a-pick { background: color-mix(in srgb, var(--ren) 22%, transparent); color: var(--t1); }
.rb-act.on.a-reword { background: color-mix(in srgb, var(--mod) 24%, transparent); color: var(--t1); }
.rb-act.on.a-squash, .rb-act.on.a-fixup { background: color-mix(in srgb, #a371f7 24%, transparent); color: var(--t1); }
.rb-act.on.a-drop { background: color-mix(in srgb, var(--del) 24%, transparent); color: var(--t1); }
.rb-move { display: flex; flex: none; }
.rb-summary { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-radius: var(--r-sm); background: var(--card); font-size: 12px; }
body.compact .rb-row, .side-panel .rb-row { flex-wrap: wrap; }

/* Review & MR filters */
.rv-filters { display: flex; align-items: center; gap: 8px; padding: 0 16px 10px; flex-wrap: wrap; }
.rv-search-wrap { display: flex; align-items: center; gap: 6px; flex: 1 1 220px; min-width: 0; padding: 0 8px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--raised); color: var(--t3); }
.rv-search { flex: 1; min-width: 0; border: 0 !important; background: transparent !important; box-shadow: none !important; padding-left: 0 !important; }
.rv-sel { max-width: 200px; }
.rv-sel.on { border-color: var(--ren); color: var(--ren); }
.pill.rv-new { color: var(--ren); background: color-mix(in srgb, var(--ren) 16%, transparent); font-weight: 600; }
.pill.rv-label { color: var(--t2); background: var(--card-hi); }
.rv-search-wrap { overflow: hidden; }
.rv-search { width: 0 !important; flex: 1 1 0 !important; }
@media (max-width: 620px), (pointer: coarse) { .rv-search { height: 36px !important; min-height: 36px !important; } }

/* graph search: the box (with its ×) takes the room the input used to */
.history-bar .graph-search-wrap { flex: 1 1 240px; min-width: 140px; }
@media (max-width: 820px) { .history-bar .graph-search-wrap { flex: 1 1 100%; order: 3; min-width: 0; } .history-bar .graph-search-wrap .graph-search { order: 0; } }
.search-busy { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--t2); white-space: nowrap; }

/* phones: each toolbar button says what it is, under its icon */
@media (max-width: 520px) {
  body:not(.side-panel) .repo-line .toolbar > button { flex-direction: column; gap: 2px; height: auto !important; min-height: 46px; padding: 5px 2px !important; }
  body:not(.side-panel) .repo-line .toolbar .tb-label { display: block !important; font-size: 10px; line-height: 1.1; color: var(--t2); white-space: nowrap; }
  body:not(.side-panel) .repo-line .toolbar .tb-count { display: none; }
}

.tb-label.tb-phone { display: none; }
@media (max-width: 520px) { body:not(.side-panel) .repo-line .toolbar .tb-label.tb-phone { display: block !important; } }

/* ---------- v0.8 ---------- */
/* a second look before committing */
.precommit .pc-list { display: flex; flex-direction: column; gap: 6px; margin: 10px 0; }
.pc-item { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: var(--r-sm); background: var(--card); border-left: 3px solid var(--mod); }
.pc-item.k-secret { border-left-color: var(--del); }
.pc-item.k-branch { border-left-color: var(--ren); }
.pc-hint { font-size: 12px; color: var(--t2); margin: 0 0 8px; }
/* AI explain */
.explain { padding: 16px 20px; }
.explain-wait { display: flex; align-items: center; gap: 10px; padding: 24px 4px; color: var(--t2); }
.explain-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; padding: 8px 10px; border-radius: var(--r-sm); background: color-mix(in srgb, #a371f7 10%, var(--card)); color: var(--t2); font-size: 12px; }
/* drag and drop */
[draggable="true"][data-drag-ref] { cursor: grab; }
body.dragging-ref [data-drop-ref] { outline: 1px dashed color-mix(in srgb, var(--ren) 45%, transparent); outline-offset: -1px; }
.drop-on { background: color-mix(in srgb, var(--ren) 18%, transparent) !important; outline: 2px solid var(--ren) !important; }
/* one page per file */
.fx { display: flex; flex-direction: column; min-height: 0; height: 100%; }
.fx-path { padding: 10px 16px 0; font-size: 11.5px; }
.fx-tabs { padding: 0 12px; }
.fx-pane { flex: 1; min-height: 0; overflow: auto; }
.fx-split { display: grid; grid-template-columns: minmax(240px, 34%) 1fr; height: 100%; min-height: 0; }
.fx-list { overflow: auto; border-right: 1px solid var(--line); }
.fx-row { display: flex; gap: 8px; align-items: center; width: 100%; padding: 8px 12px; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--t1); font: inherit; text-align: left; cursor: pointer; }
.fx-row:hover { background: var(--hover); }
.fx-row.sel { background: var(--sel); box-shadow: inset 2px 0 0 var(--ren); }
.fx-meta { font-size: 11px; white-space: nowrap; }
.fx-diff { overflow: auto; min-width: 0; }
.fx-diff-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.side-panel .fx-split, body.compact .fx-split { grid-template-columns: 1fr; grid-template-rows: 38% 1fr; }
.side-panel .fx-list, body.compact .fx-list { border-right: 0; border-bottom: 1px solid var(--line); }
.fx-blame .bl { position: relative; }
.bl-age { width: 4px; align-self: stretch; flex: none; background: color-mix(in srgb, var(--mod) calc(var(--heat, 1) * 100%), color-mix(in srgb, var(--ren) 40%, transparent)); opacity: calc(.25 + var(--heat, 1) * .75); }
.fx-note { padding: 8px 12px; font-size: 12px; }

/* ---------- v0.8.1 ---------- */
.pill.rv-waiting { display: inline-flex; align-items: center; gap: 4px; color: var(--mod); background: color-mix(in srgb, var(--mod) 16%, transparent); border: 1px solid color-mix(in srgb, var(--mod) 40%, transparent); font-weight: 600; }
.pill.rv-running { display: inline-flex; align-items: center; gap: 5px; color: var(--info); background: color-mix(in srgb, var(--info) 14%, transparent); }
.spinner.sm { width: 10px; height: 10px; border-width: 1.5px; }
.review-row.rv-done-approve { animation: rv-approved 1.1s ease; }
@keyframes rv-approved { 0% { background: color-mix(in srgb, var(--add) 28%, transparent); } 60% { background: color-mix(in srgb, var(--mod) 16%, transparent); } 100% { background: transparent; } }
.review-row.rv-done-approve .rv-result { color: var(--mod); }
.rv-n.hot-bad { background: color-mix(in srgb, var(--del) 30%, transparent); color: var(--del); }
/* new merge request: a roomier dialog */
.dialog.mr-dialog { width: min(880px, calc(100vw - 32px)) !important; max-width: none !important; }
.mr-dialog textarea { min-height: 220px; }
/* pipelines tab */
.pipe-list { display: flex; flex-direction: column; padding: 0 16px 16px; gap: 6px; }
.pipe-list .pipe-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); color: var(--t1); font: inherit; text-align: left; cursor: pointer; }
.pipe-list .pipe-row:hover { border-color: var(--line-hi); background: var(--card-hi); }
.pipe-list .pr-failed { border-left: 3px solid var(--del); }
.pipe-list .pr-running, .pipe-list .pr-pending { border-left: 3px solid var(--info); }
.pipe-list .pr-passed { border-left: 3px solid var(--add); }
.pipe-meta { font-size: 11.5px; margin-top: 3px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

/* tabs: an icon before each name */
nav.tabs .tab { display: inline-flex; align-items: center; gap: 6px; }
nav.tabs .tab > svg { flex: none; opacity: .7; }
nav.tabs .tab.active > svg { opacity: 1; color: var(--ren); }

.pill.rv-conflict { display: inline-flex; align-items: center; gap: 4px; color: var(--del); background: color-mix(in srgb, var(--del) 15%, transparent); border: 1px solid color-mix(in srgb, var(--del) 40%, transparent); font-weight: 600; }

/* pipelines tab: columns like GitLab's list */
.pipe-list { gap: 0 !important; }
.pc-head, .pipe-list .pipe-row { display: grid !important; grid-template-columns: 128px minmax(200px, 1fr) minmax(150px, 260px) 150px 150px 16px; align-items: center; gap: 14px; }
.pc-head { padding: 6px 12px; font-size: 11px; font-weight: 600; color: var(--t3); text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--line); }
.pipe-list .pipe-row { border-radius: 0 !important; border-width: 0 0 1px 3px !important; border-color: var(--line) !important; background: transparent !important; padding: 10px 12px !important; }
.pipe-list .pipe-row:hover { background: var(--hover) !important; }
.pipe-list .pr-failed { border-left-color: var(--del) !important; background: color-mix(in srgb, var(--del) 5%, transparent) !important; }
.pipe-list .pr-running, .pipe-list .pr-pending { border-left-color: var(--info) !important; }
.pipe-list .pr-passed { border-left-color: color-mix(in srgb, var(--add) 70%, transparent) !important; }
.pipe-list .pr-canceled, .pipe-list .pr-skipped { border-left-color: var(--t3) !important; }
.pc-status { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
.pc-time { font-size: 11px; display: inline-flex; align-items: center; gap: 4px; }
.pc-main { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.pc-title { font-weight: 600; color: var(--t1); }
.pc-sub { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--t2); }
.pc-id { font-family: var(--mono); color: var(--ren); }
.pill.pc-src { font-size: 10.5px; color: var(--t2); background: var(--card-hi); }
.pc-ref { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.pc-ref .ref { max-width: 100%; }
.pc-mr { color: #a371f7 !important; border-color: color-mix(in srgb, #a371f7 45%, transparent) !important; }
.pc-sha { font-size: 11px; display: inline-flex; align-items: center; gap: 4px; }
.pc-stages { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.pc-dot { width: 18px; height: 18px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; border: 1.5px solid var(--t3); color: var(--t3); }
.pc-dot.st-passed { border-color: var(--add); color: var(--add); }
.pc-dot.st-failed { border-color: var(--del); color: #fff; background: var(--del); }
.pc-dot.st-running, .pc-dot.st-pending { border-color: var(--info); color: var(--info); }
.pc-dot.st-manual { border-color: var(--mod); }
.pc-by { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 12px; color: var(--t2); }
@media (max-width: 900px) {
  .pc-head { display: none !important; }
  .pc-head, .pipe-list .pipe-row { grid-template-columns: 110px 1fr 16px; }
  .pc-ref, .pc-stages, .pc-by { grid-column: 2; }
}
body.compact .pc-head, .side-panel .pc-head { display: none !important; }
body.compact .pipe-list .pipe-row, .side-panel .pipe-list .pipe-row { grid-template-columns: 110px 1fr 16px; }
body.compact .pc-ref, body.compact .pc-stages, body.compact .pc-by, .side-panel .pc-ref, .side-panel .pc-stages, .side-panel .pc-by { grid-column: 2; }

/* merge queue pills on review rows */
.rv-q { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.rv-q .spinner { width: 10px; height: 10px; }
.rv-q.wait { background: color-mix(in srgb, var(--accent, #8fb0f0) 14%, transparent); color: var(--accent, #8fb0f0); }
.rv-q.run { background: color-mix(in srgb, #e0b050 16%, transparent); color: #d9a640; }
.rv-q.bad { background: color-mix(in srgb, #e5534b 16%, transparent); color: #e5534b; }
.review-row.rv-queued { opacity: .92; }
.pill.rv-merged { display: inline-flex; align-items: center; gap: 4px; color: #a371f7; background: color-mix(in srgb, #a371f7 16%, transparent); border: 1px solid color-mix(in srgb, #a371f7 40%, transparent); font-weight: 600; }
.pill.rv-closed { color: var(--del, #f85149); border: 1px solid color-mix(in srgb, var(--del, #f85149) 40%, transparent); }
.review-row.rv-done .review-icon { color: #a371f7; }
.review-row.rv-done .review-title > .ellipsis { opacity: .8; }
.rv-check-gap { display: inline-block; width: 13px; flex: none; }
.rv-group { display: flex; align-items: center; gap: 6px; padding: 14px 12px 6px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--t3); }
.rv-group-merged { color: #a371f7; border-top: 1px solid var(--line); margin-top: 6px; }
.rv-group-n { font-weight: 600; padding: 0 6px; border-radius: 8px; background: color-mix(in srgb, currentColor 14%, transparent); }
.rv-group-hint { margin-left: auto; font-weight: 400; text-transform: none; letter-spacing: 0; opacity: .7; }
.rv-group-empty { padding: 4px 12px 10px; font-size: 12px; }
.rv-day { padding: 8px 12px 2px; font-size: 11px; color: var(--t3); }
.rv-more { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 12px 24px; }
.rv-more .dim { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
.rv-more-btn { min-width: 200px; justify-content: center; }
.rv-more-hint { text-align: center; }
.review-row.rv-done { padding-top: 7px; padding-bottom: 7px; }
.review-row.rv-done .review-icon { color: #a371f7; background: color-mix(in srgb, #a371f7 14%, transparent); }
.review-row.rv-done .review-title { font-weight: 500; }
.rv-day { padding: 10px 16px 4px; font-size: 11px; font-weight: 600; color: var(--t3); border-bottom: 1px solid var(--line); }
.rv-group { padding-left: 16px; }
/* Repos overview */
.rov-sheet .sheet-body { padding: 0; }
.rov-summary { display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 10px; border-bottom: 1px solid var(--line); }
.rov-chip { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line-hi); background: transparent; color: var(--t2); font-size: 12px; cursor: pointer; }
.rov-chip b { color: var(--fg); font-weight: 600; }
.rov-chip:hover { background: var(--card-hi); }
.rov-chip.on { background: color-mix(in srgb, var(--ren) 18%, transparent); border-color: color-mix(in srgb, var(--ren) 50%, transparent); color: var(--fg); }
.rov-chip.rov-attention b { color: var(--del); }
.rov-chip.rov-changes b { color: var(--mod); }
.rov-chip.rov-behind b { color: var(--mod); }
.rov-chip.rov-ahead b { color: var(--add); }
.rov-chip.rov-info { cursor: default; border-style: dashed; }
.rov-chip.rov-info:hover { background: transparent; }
.rov-search { margin-left: auto; min-width: 200px; height: 28px; padding: 0 10px; border-radius: var(--r-sm); border: 1px solid var(--line-hi); background: var(--card); color: var(--fg); font: inherit; font-size: 12px; }
.rov-row { display: grid; grid-template-columns: 10px minmax(150px, 1fr) auto auto; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.rov-row:hover { background: var(--card); }
.rov-row.busy { opacity: .85; }
.rov-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--add); }
.rov-dot.warn { background: var(--mod); }
.rov-dot.bad { background: var(--del); box-shadow: 0 0 0 3px color-mix(in srgb, var(--del) 20%, transparent); }
.rov-name { min-width: 0; }

function h(tag, props, ...children) {
  const el = document.createElement(tag)
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue
      if (k === 'class') el.className = v
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v)
      else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v)
      else if (k in el && typeof v !== 'string') el[k] = v

  }
  append(el, children)

}

}

const LANG_KEY = 'gitx.lang'
const pickLang = (v) => (LOCALES[v] || v === 'en' ? v : 'en')
// The worker owns the setting; the last value is kept here so the first paint is already in that language.
let LANG = 'en'
try {
  LANG = pickLang(localStorage.getItem(LANG_KEY) || 'en')
} catch {}
const DICT = LOCALES[LANG] || {}
function t(s, vars) {
  let out = DICT[s] || s
  if (vars) out = out.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? String(vars[k]) : m))
  return out
}
// The language dropdown at the top right: a globe and the language's own name. The choice is saved in
// Orca's plugin settings (and kept here for the next start), so it is remembered.
function langPicker() {
  const sel = h(
    'select',
    {
      class: 'lang-select',
      'aria-label': t('Language'),
      onChange: () => {
        const v = sel.value
        request('ui.language', { lang: v }, 10000).then(() => applyLang(v), () => applyLang(v))
      }
    },
    LANGS.map(([v, l]) => h('option', { value: v, selected: v === LANG }, l))
  )
  const code = h('span', { class: 'lang-code' }, LANG === 'zh-CN' ? '中' : LANG.toUpperCase())
  return h('label', { class: 'icon-btn lang-pick', title: t('Language') }, icon('globe', 14), code, sel)
}
// Applies a language picked in Orca's settings or in Git Control's Settings tab: strings are built once, so reload.
function applyLang(v) {
  const next = pickLang(v || 'en')
  try {
    localStorage.setItem(LANG_KEY, next)
  } catch {}
  if (next !== LANG) location.reload()
}

function ago(ts) {
  const s = Date.now() / 1000 - ts
  if (s < 60) return t('just now')
  const units = [
    [31536000, (n) => t('{n}y ago', { n })],
    [2592000, (n) => t('{n}mo ago', { n })],
    [604800, (n) => t('{n}w ago', { n })],
    [86400, (n) => t('{n}d ago', { n })],
    [3600, (n) => t('{n}h ago', { n })],
    [60, (n) => t('{n}m ago', { n })]
  ]
  for (const [n, u] of units) if (s >= n) return u(Math.floor(s / n))
  return ''
}
const fullDate = (t) => new Date(t * 1000).toLocaleString(LANG)

async function request(name, input, timeoutMs = 30000) {
  if (!hasOrca) throw new Error(t('Open this panel inside Orca'))
  input = JSON.parse(JSON.stringify(input ?? {})) // drop undefined values: Orca rejects them as invalid input
  try {
    if (window.orca.plugin?.request) return await window.orca.plugin.request(name, input, { timeoutMs })
    const r = await window.orca.host.call('plugin.request', { name, input, timeoutMs })
    return r.output
  } catch (e) {
    if (/changed or is no longer approved/i.test(e?.message || '')) pluginUpdated()
    throw e
  }
}
